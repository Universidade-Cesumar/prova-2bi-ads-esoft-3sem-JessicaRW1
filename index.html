<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado - Sprint 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Almoxarifado - Saúde</h1>
        <div class="card">
            <h2>Cadastrar Novo Material</h2>
            <div class="form-grupo">
                <label for="input-nome">Nome do Material:</label>
                <input type="text" id="input-nome" placeholder="Ex: Seringa Descartável">
            </div>
            
            <div class="form-grupo">
                <label for="input-quantidade">Quantidade:</label>
                <input type="number" id="input-quantidade" placeholder="Ex: 100">
            </div>

            <button id="btn-cadastrar">Cadastrar</button>
        </div>
<div class="card">
            <h2>Inventário Atual</h2>
            <div class="dashboard-grupo" style="display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; gap: 10px;">
        <input type="text" id="input-busca" placeholder="Pesquisar material..." style="flex: 1; padding: 8px;">
        <span style="font-weight: bold; white-space: nowrap;">Total: <span id="total-itens">0</span></span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Material</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista-materiais">
        </tbody>
    </table>
</div>
    </div> <script src="main.js"></script>
</body>
</html>
